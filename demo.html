<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#08152b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>OY! Only You — Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@600;800&display=swap">
<style>
/* OY! — a night-vault look: deep navy steel, brushed-gold hardware.
   Layout: single centred column (max 560px), sticky top bar, floating add button. */
:root {
  --bg: #08152b;          /* vault night */
  --surface: #0f2140;     /* panel steel */
  --surface-2: #16305a;   /* raised steel */
  --line: #24406e;
  --fg: #eef2f9;
  --muted: #9aaccb;
  --gold: #d9ad4b;        /* brushed gold */
  --gold-hi: #f1cd78;
  --on-gold: #1a1406;
  --danger: #ff7b6e;
  --ok: #6fd3a2;
  --warn: #f3b552;
  --font-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --radius: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1f7; --surface: #ffffff; --surface-2: #e3e9f4; --line: #cdd6e6;
    --fg: #0b1a33; --muted: #52627f; --gold: #b07f17; --gold-hi: #c9952a; --on-gold: #ffffff;
    --danger: #c83a2c; --ok: #1d8a57; --warn: #a86b00; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1f7; --surface: #ffffff; --surface-2: #e3e9f4; --line: #cdd6e6;
  --fg: #0b1a33; --muted: #52627f; --gold: #b07f17; --gold-hi: #c9952a; --on-gold: #ffffff;
  --danger: #c83a2c; --ok: #1d8a57; --warn: #a86b00; color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; position: relative; }
h1 { font: 600 1.5rem/1.2 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font: 600 1.05rem/1.3 var(--font-body); margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.mono { font-family: var(--font-mono); }
.center { text-align: center; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Logo */
.logo { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.logo-mark { display: block; height: 2rem; aspect-ratio: 360 / 178; }
.logo-mark svg { display: block; width: 100%; height: 100%; overflow: visible; }
.logo-hole { fill: var(--bg); }
.logo-bang { color: var(--fg); }
.logo-sub { font-size: .7rem; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
.logo-lg .logo-mark { height: 4.4rem; margin-bottom: 6px; filter: drop-shadow(0 6px 16px color-mix(in srgb, var(--gold) 30%, transparent)); }
.logo-lg .logo-sub { font-size: .8rem; }
.logo-sm { flex-direction: row; }
.logo-sm .logo-mark { height: 1.3rem; }

/* Layout */
.center-screen {
  display: flex; flex-direction: column; align-items: stretch; gap: 18px; text-align: center;
  padding-block: 48px 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.center-screen > .logo { margin-bottom: 4px; }
.tagline { color: var(--muted); max-width: 32ch; margin: 0 auto; }
.who { color: var(--muted); font-size: .95rem; }
.stack { display: flex; flex-direction: column; gap: 12px; text-align: left; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.screen { min-height: 100vh; padding-bottom: 110px; }
.content {
  display: flex; flex-direction: column; gap: 14px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Buttons */
.btn {
  border: 1px solid transparent; border-radius: 12px; padding: 11px 18px; cursor: pointer;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
  background: var(--surface-2);
}
.btn:active { transform: scale(.98); }
.btn.big { padding: 15px 18px; font-size: 1.02rem; width: 100%; }
.btn.gold { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: var(--on-gold); }
.btn.outline { background: transparent; border-color: var(--line); }
@media (hover: hover) { .btn.outline:hover { border-color: var(--gold); } }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.link { background: none; color: var(--gold); padding: 6px; font-weight: 500; }
.btn.link.subtle { color: var(--muted); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.danger-outline { background: transparent; border-color: var(--danger); color: var(--danger); margin-top: 8px; }
.g { width: 22px; height: 22px; border-radius: 50%; background: var(--fg); color: var(--bg); font-weight: 800; font-size: .8rem; display: inline-grid; place-items: center; }

/* Promises list */
.promises { list-style: none; padding: 16px; margin: 6px 0 0; display: grid; gap: 10px; text-align: left;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: .92rem; }
.promises li { display: flex; gap: 10px; align-items: baseline; }
.promises li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--gold); transform: rotate(45deg) translateY(-1px); }
.note { color: var(--muted); font-size: .85rem; }
.tip { font-size: .88rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); padding: 10px 12px; border-radius: 10px; }

/* Inputs */
.input {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 14px; outline: none; transition: border-color .15s ease;
}
.input:focus { border-color: var(--gold); }
textarea.input { resize: vertical; min-height: 80px; line-height: 1.45; }
.pw-wrap { position: relative; flex: 1; min-width: 0; }
.pw-wrap .input { padding-right: 64px; font-family: var(--font-mono); letter-spacing: .02em; }
.eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--gold); font-size: .82rem; font-weight: 600; padding: 8px; cursor: pointer; }
.with-btn { display: flex; gap: 8px; align-items: stretch; }
.with-btn .mini { padding: 0 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; cursor: pointer; text-align: left; }
.check input { width: 20px; height: 20px; accent-color: var(--gold); flex: none; margin-top: 2px; }
.search { padding-left: 16px; }

/* Strength meter */
.meter { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.meter-track { flex: 1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter-fill { height: 100%; width: 0; transition: width .2s ease, background .2s ease; background: var(--danger); }
.meter-fill[data-level="2"] { background: var(--warn); }
.meter-fill[data-level="3"], .meter-fill[data-level="4"] { background: var(--ok); }
.meter-label { font-size: .78rem; color: var(--muted); min-width: 72px; text-align: right; }

/* Recovery key */
.badge-gold { align-self: center; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); padding: 4px 10px; border-radius: 99px; }
.rk { font: 600 1.15rem/1.7 var(--font-mono); letter-spacing: .06em; padding: 18px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--gold); word-break: break-word; user-select: all; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding-block: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-left { display: flex; justify-content: flex-start; }
.topbar-right { display: flex; justify-content: flex-end; gap: 4px; }
.topbar-title { font-weight: 600; text-align: center; }
.icon-btn { border: 0; background: none; color: var(--fg); min-width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 1.05rem; padding: 0 8px; font-weight: 600; }
@media (hover: hover) { .icon-btn:hover { background: var(--surface-2); } }

/* Status */
.status-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sync { font-size: .8rem; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync-saved::before { background: var(--ok); }
.sync-saving::before { background: var(--gold); animation: pulse 1s infinite; }
.sync-pending::before, .sync-sample::before { background: var(--warn); }
.sync-local::before { background: var(--gold); }
.sync-idle { visibility: hidden; }
@keyframes pulse { 50% { opacity: .3; } }

/* Chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 7px 13px; font-size: .86rem; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--gold); border-color: var(--gold); color: var(--on-gold); font-weight: 600; }

/* List */
.list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.row-item { display: flex; align-items: center; border-top: 1px solid var(--line); }
.row-item:first-child { border-top: 0; }
.row-main { flex: 1; min-width: 0; display: flex; gap: 14px; align-items: center; text-align: left; padding: 13px 14px; border: 0; background: none; cursor: pointer; }
@media (hover: hover) { .row-main:hover { background: var(--surface-2); } }
.row-icon { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font-size: 1.2rem; }
.row-text { display: flex; flex-direction: column; min-width: 0; }
.row-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.star { color: var(--gold); }
.row-item > .icon-btn { margin-right: 8px; font-size: .82rem; color: var(--gold); }
.empty { text-align: center; padding: 48px 16px; display: grid; gap: 6px; }
.empty-icon { font-size: 2.4rem; }

.fab {
  position: fixed; z-index: 6;
  right: max(20px, calc(50% - 260px), env(safe-area-inset-right, 0px));
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  width: 62px; height: 62px; border-radius: 20px; border: 0; cursor: pointer;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: var(--on-gold);
  font: 300 2.2rem/1 var(--font-body); box-shadow: 0 10px 28px rgba(0,0,0,.35);
}

/* Item detail */
.item-head { display: flex; gap: 14px; align-items: center; }
.item-head > div { flex: 1; min-width: 0; }
.item-head h1 { overflow-wrap: anywhere; }
.item-icon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 1.6rem; background: var(--surface-2); border: 1px solid var(--gold); flex: none; }
.star-btn { border: 0; background: none; font-size: 1.6rem; color: var(--muted); cursor: pointer; }
.star-btn.on { color: var(--gold); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px; }
.field { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.field:first-child { border-top: 0; }
.field-label { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.field-body { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.field-val { font-family: var(--font-mono); font-size: .95rem; overflow-wrap: anywhere; min-width: 0; white-space: pre-wrap; margin: 0; }
.field-val.masked { letter-spacing: .15em; color: var(--muted); }
.field-actions { display: flex; gap: 6px; flex: none; align-self: flex-start; }
.mini { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 6px 10px; font-size: .8rem; font-weight: 600; color: var(--gold); cursor: pointer; text-decoration: none; }
.form-field { display: grid; gap: 6px; }

/* Settings */
.section-title { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); padding: 14px 0 6px; }
.setting-row { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left;
  padding: 13px 0; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; }
.setting-row.static { cursor: default; }
.setting-row select { width: auto; padding: 8px 10px; }
.section-title + .setting-row { border-top: 0; }
.setting-row > span:first-child { display: grid; min-width: 0; }
.setting-label { font-weight: 500; overflow-wrap: anywhere; }
.setting-sub { font-size: .82rem; color: var(--muted); }
.chev { color: var(--muted); font-size: 1.3rem; }
.danger-text .setting-label { color: var(--danger); }

/* Modals */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(2,8,20,.6); display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(3px); animation: fade .15s ease; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 22px 22px 0 0; display: grid; gap: 14px;
  padding-block: 22px calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  animation: rise .2s ease; max-height: 90vh; overflow-y: auto; }
.sheet h2 { font-family: var(--font-display); font-size: 1.1rem; }
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
@media (min-width: 600px) { .overlay { align-items: center; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.type-tile { display: grid; gap: 6px; justify-items: center; padding: 16px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: .86rem; font-weight: 600; }
@media (hover: hover) { .type-tile:hover { border-color: var(--gold); } }
.type-icon { font-size: 1.6rem; }
@media (max-width: 360px) { .type-grid { grid-template-columns: repeat(2, 1fr); } }
.gen-out { font-size: 1.15rem; padding: 16px; border-radius: 12px; background: var(--bg); border: 1px solid var(--gold); overflow-wrap: anywhere; text-align: center; }
.toggles { display: flex; flex-wrap: wrap; gap: 14px; }
input[type="range"] { width: 100%; accent-color: var(--gold); }

/* Toast + busy */
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .9rem; font-weight: 600;
  opacity: 0; pointer-events: none; transition: all .2s ease; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--danger); color: #fff; }
.busy { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 82%, transparent); display: grid; place-content: center; justify-items: center; gap: 14px; }
.spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.preview-banner { background: var(--surface-2); color: var(--muted); font-size: .8rem; text-align: center; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
@media print { body * { visibility: hidden; } .rk, .rk * { visibility: visible; } .rk { position: absolute; top: 40px; left: 20px; right: 20px; color: #000; } }

/* ---------- Icons ---------- */
.ico { display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none; }
.ico svg { width: 100%; height: 100%; display: block; }
.ico-sm { width: 15px; height: 15px; }
.icon-btn { display: inline-grid; place-items: center; color: var(--gold); }
.icon-btn.text { font-size: .95rem; }
.topbar-left .icon-btn .ico, .topbar-right .icon-btn .ico { width: 23px; height: 23px; }

/* ---------- Home: icon grid only ---------- */
.home { display: flex; flex-direction: column; }
.home-grid {
  flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-content: center;
  padding-block: 28px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.home-tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; min-width: 0; min-height: 0;
  container-type: size;
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--gold);
  -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
}
.home-icon {
  width: min(100cqw, calc(100cqh - 26px), 132px); aspect-ratio: 1; display: grid; place-items: center; position: relative; flex: none;
  border-radius: 26%; border: 1px solid color-mix(in srgb, var(--gold) 26%, var(--line));
  background:
    radial-gradient(90% 70% at 28% 12%, color-mix(in srgb, var(--gold-hi) 20%, transparent), transparent 62%),
    radial-gradient(80% 60% at 80% 110%, color-mix(in srgb, var(--gold) 14%, transparent), transparent 70%),
    linear-gradient(160deg, var(--surface-2), var(--surface) 70%);
  box-shadow:
    inset 0 1px 0 color-mix(in srgb, var(--gold-hi) 28%, transparent),
    inset 0 -10px 18px color-mix(in srgb, #000 22%, transparent),
    0 10px 22px -10px color-mix(in srgb, #000 70%, transparent);
  transition: transform .12s ease, border-color .15s ease, box-shadow .15s ease;
  overflow: hidden;
}
.home-icon::before { /* soft glass sheen across the top */
  content: ""; position: absolute; inset: 0 0 52% 0; border-radius: inherit;
  background: linear-gradient(180deg, color-mix(in srgb, #fff 9%, transparent), transparent);
  pointer-events: none;
}
@media (hover: hover) { .home-tile:hover .home-icon { border-color: var(--gold); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--gold-hi) 35%, transparent), 0 0 0 1px var(--gold), 0 12px 26px -10px color-mix(in srgb, var(--gold) 45%, transparent); } }
.home-tile:active .home-icon { transform: scale(.94); }
.home-tile.has .home-icon::after { content: ""; position: absolute; top: 11%; right: 11%; width: 7px; height: 7px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 8px var(--gold); }
.home-label { font-size: .78rem; font-weight: 600; letter-spacing: .02em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ico-home { width: 50%; height: 50%; position: relative; filter: drop-shadow(0 3px 6px color-mix(in srgb, var(--gold) 35%, transparent)); }
.home-grid { row-gap: 18px; }
.home-grid.arranging { touch-action: none; }
.home-tile.wiggle .home-icon { animation: wiggle .32s ease-in-out infinite alternate; border-style: dashed; border-color: var(--gold); }
.home-tile.wiggle:nth-child(2n) .home-icon { animation-delay: -.16s; }
.home-tile.dragging { z-index: 2; }
.home-tile.dragging .home-icon { animation: none; transform: scale(1.08); box-shadow: 0 12px 30px rgba(0,0,0,.35); background: var(--surface-2); }
@keyframes wiggle { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
.topbar-group { display: inline-flex; gap: 2px; }
.muted-btn { color: var(--muted); }
.reset-order { align-self: center; margin-bottom: 24px; }

/* Details / Documents-only switch */
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; gap: 4px; border-radius: 13px; background: var(--surface); border: 1px solid var(--line); }
.seg-opt { border: 0; background: none; padding: 10px 8px; border-radius: 10px; font-weight: 600; font-size: .9rem; color: var(--muted); cursor: pointer; }
.seg-opt.on { background: var(--gold); color: var(--on-gold); }
@media (min-width: 520px) { .home-grid { gap: 18px; } }

/* ---------- Category ---------- */
.cat-hero { display: grid; place-items: center; padding: 2px 0 0; color: var(--gold); pointer-events: none; }
.ico-hero { width: 54px; height: 54px; }
.ico-hero svg { stroke-width: 1.3; }
.list .row-main { padding: 15px 16px; }
.row-att { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: .8rem; margin-left: auto; padding-left: 8px; flex: none; }
.copy-btn { font-size: .82rem; margin-right: 8px; }
.ico-fab { width: 28px; height: 28px; }
.fab { display: grid; place-items: center; }
.ico-fab svg { stroke-width: 2; }
.item-icon { width: 56px; height: 56px; border-radius: 16px; padding: 13px; background: var(--surface-2); border: 1px solid var(--gold); color: var(--gold); }
.pad { padding: 12px 0; }

/* ---------- Attachments ---------- */
.att-card { padding: 14px 16px 16px; display: grid; gap: 12px; }
.att-head { display: flex; align-items: center; justify-content: space-between; }
.att-head .mini { display: inline-flex; align-items: center; gap: 5px; }
.att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.att-tile { padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); cursor: pointer; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; }
@media (hover: hover) { .att-tile:hover { border-color: var(--gold); } }
.att-thumb { display: grid; place-items: center; width: 100%; height: 100%; background: center / cover no-repeat; color: var(--gold); font-size: .75rem; font-weight: 700; gap: 2px; }
.att-thumb.pdf .ico { width: 26px; height: 26px; }
.att-thumb.loading { animation: pulse 1.2s infinite; }
.att-empty { border: 1px dashed var(--line); border-radius: 12px; padding: 20px 14px; background: none; color: var(--muted); cursor: pointer; font-size: .9rem; }
@media (hover: hover) { .att-empty:hover { border-color: var(--gold); color: var(--fg); } }
.att-full { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 12px; background: var(--bg); }
.att-pdf { display: grid; justify-items: center; gap: 10px; padding: 20px; text-align: center; overflow-wrap: anywhere; }
.ico-xl { width: 56px; height: 56px; color: var(--gold); }
.btn.slim { margin: 0; margin-right: auto; }
.sheet h2 { overflow-wrap: anywhere; }

/* Home fits one screen: no scrolling */
html { height: 100%; }
body.is-home { height: 100%; overflow: hidden; display: flex; flex-direction: column; }
body.is-home #app { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; }
body.is-home .screen.home { flex: 1; min-height: 0; padding-bottom: 0; display: flex; flex-direction: column; }
body.is-home .home-grid {
  flex: 1; min-height: 0; align-content: stretch;
  grid-template-rows: repeat(var(--rows, 4), minmax(0, 1fr)); gap: 8px 12px;
  padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
}
body.is-home .reset-order { flex: none; margin: 0 0 10px; }
.home-tile { height: 100%; }
.att-wrap { position: relative; }
.att-wrap .att-tile { width: 100%; display: block; cursor: default; }
.att-x { position: absolute; top: -7px; right: -7px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font-size: 1rem; line-height: 1; cursor: pointer; display: grid; place-items: center; }
@media (hover: hover) { .att-x:hover { border-color: var(--danger); color: var(--danger); } }

/* Theme picker */
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; padding: 4px 0 6px; }
.theme-opt { display: grid; justify-items: center; gap: 8px; padding: 12px 6px 10px; border-radius: 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); }
.theme-opt.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.theme-swatch { display: flex; }
.theme-swatch span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface-2); margin-left: -6px; }
.theme-swatch span:first-child { margin-left: 0; background: var(--t-deep); }
.theme-swatch span:nth-child(2) { background: var(--t-accent); }
.theme-swatch span:nth-child(3) { background: var(--t-hi); }
.theme-name { font-size: .82rem; font-weight: 600; }
.theme-opt.on .theme-name { color: var(--gold); }
.theme-note { padding: 4px 0 14px; }

/* Theme dropdown */
.dd { display: grid; gap: 6px; padding-bottom: 4px; }
.dd-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); text-align: left; }
.dd-btn.open { border-color: var(--gold); }
.dd-name { flex: 1; font-weight: 600; }
.dd-chev { color: var(--gold); font-size: 1.2rem; line-height: 1; transition: transform .15s ease; }
.dd-btn.open .dd-chev { transform: rotate(180deg); }
.dd-list { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.dd-opt { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; text-align: left; }
.dd-opt:first-child { border-top: 0; }
@media (hover: hover) { .dd-opt:hover { background: var(--surface); } }
.dd-opt.on .dd-name { color: var(--gold); }
.dd-tick { color: var(--gold); font-weight: 700; }
.theme-swatch span { border-color: var(--surface-2); }

/* More sheet + category editor */
.more-list { display: grid; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.more-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: var(--surface-2); cursor: pointer; text-align: left; }
.more-row:first-child { border-top: 0; }
@media (hover: hover) { .more-row:hover { background: var(--surface); } }
.more-ico { color: var(--gold); width: 24px; height: 24px; }
.more-label { flex: 1; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.more-count { color: var(--muted); font-size: .85rem; }
.more-add { background: var(--surface); }
.more-add .more-label { color: var(--gold); }
.icon-picks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.icon-pick { aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--gold); display: grid; place-items: center; cursor: pointer; }
.icon-pick .ico { width: 24px; height: 24px; }
.icon-pick.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; background: var(--surface); }

.ico-hero { width: 34px; height: 34px; }
.item-icon svg { overflow: visible; }
.home-label { color: var(--fg); opacity: .78; }

/* ---------- Icon styles ---------- */
.ico-bold, .ico-colour { color: var(--gold); }
.ico-bold svg, .ico-colour svg { filter: drop-shadow(0 1px 0 color-mix(in srgb, #000 25%, transparent)); }
/* Bold on tiles: gradient-feel by layering a lighter top */
[data-icons="bold"] .ico-home { color: var(--gold-hi); }
/* Colour: the tile takes the category colour, symbol turns white */
[data-icons="colour"] .home-icon {
  border-color: color-mix(in srgb, var(--c) 70%, #fff 10%);
  background:
    radial-gradient(90% 70% at 28% 10%, color-mix(in srgb, #fff 32%, transparent), transparent 60%),
    linear-gradient(160deg, color-mix(in srgb, var(--c) 82%, #fff), color-mix(in srgb, var(--c) 78%, #000));
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 40%, transparent), inset 0 -8px 16px color-mix(in srgb, #000 18%, transparent),
    0 10px 22px -10px color-mix(in srgb, var(--c) 70%, transparent);
}
[data-icons="colour"] .ico-home { color: #fff; filter: drop-shadow(0 2px 3px color-mix(in srgb, #000 30%, transparent)); }
[data-icons="colour"] .home-tile.has .home-icon::after { background: #fff; box-shadow: 0 0 6px #fff; }
@media (hover: hover) { [data-icons="colour"] .home-tile:hover .home-icon { border-color: #fff; box-shadow: 0 0 0 2px var(--gold); } }
.ico-colour:not(.ico-home) {
  color: #fff; border-radius: 28%; padding: 5px; /* fixed padding: a % would be taken from the page width */
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 82%, #fff), color-mix(in srgb, var(--c) 80%, #000));
}
.item-icon.ico-colour { padding: 12px; border-color: transparent; }
/* Emoji */
.ico-emoji { line-height: 1; text-align: center; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
.ico-home.ico-emoji { font-size: calc(min(100cqw, 100cqh - 26px, 132px) * .46); width: auto; height: auto; filter: drop-shadow(0 4px 6px color-mix(in srgb, #000 30%, transparent)); }
.ico-hero.ico-emoji { font-size: 30px; width: auto; height: auto; }
.item-icon.ico-emoji { font-size: 28px; }
.more-ico.ico-emoji { font-size: 20px; }
.pick-ico { width: 24px; height: 24px; }
.pick-ico.ico-emoji { font-size: 22px; }
.pick-ico.ico-colour { width: 30px; height: 30px; padding: 6px; }
.more-ico.ico-colour { width: 30px; height: 30px; padding: 6px; }
/* Samples in the dropdown */
.style-sample { display: inline-flex; gap: 6px; }
.style-ico { width: 24px; height: 24px; }
.style-ico.ico-emoji { font-size: 20px; width: 24px; }
.style-ico.ico-colour { width: 26px; height: 26px; padding: 5px; }

/* ---------- Logo subtitle swap: Only You → Can See ---------- */
.logo-sub { display: grid; justify-items: center; }
.logo-sub > span { grid-area: 1 / 1; transition: opacity .45s ease, transform .45s ease, letter-spacing .6s ease; }
.logo-sub .sub-b { opacity: 0; transform: translateY(8px); color: var(--gold); }
.opening .logo-sub .sub-a { opacity: 0; transform: translateY(-8px); transition-delay: .35s; }
.opening .logo-sub .sub-b { opacity: 1; transform: none; letter-spacing: .4em; transition-delay: .5s; }

/* ---------- Unlock screen ---------- */
.unlock-screen {
  min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; text-align: center;
  padding-block: 40px 22px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.unlock-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.unlock-foot { display: grid; justify-items: center; gap: 2px; }
.big-lock {
  position: relative; width: 168px; height: 168px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--gold) 18%, var(--surface-2)), var(--surface) 70%);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--gold) 35%, transparent), 0 18px 40px -16px color-mix(in srgb, #000 70%, transparent),
    inset 0 1px 0 color-mix(in srgb, var(--gold-hi) 30%, transparent);
  transition: transform .15s ease;
}
.big-lock::before { /* breathing ring that invites a tap */
  content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--gold); opacity: .0;
  animation: ring 2.6s ease-out infinite;
}
@keyframes ring { 0% { transform: scale(.92); opacity: .55; } 100% { transform: scale(1.18); opacity: 0; } }
.big-lock:active { transform: scale(.96); }

.big-lock-art svg { width: 100%; height: 100%; overflow: visible; }


.lock-hint { color: var(--muted); font-size: .95rem; min-height: 1.5em; }
.unlock-panel { width: 100%; max-width: 360px; display: grid; gap: 12px; animation: rise .25s ease; }

.opening .big-lock::before { animation: none; }

.opening .lock-hint { opacity: 0; }
@keyframes glow { 40% { box-shadow: 0 0 0 1px var(--gold), 0 0 60px 6px color-mix(in srgb, var(--gold) 55%, transparent); } 100% { box-shadow: 0 0 0 1px var(--gold), 0 0 90px 10px color-mix(in srgb, var(--gold) 25%, transparent); transform: scale(1.04); } }
.shake { animation: shake .45s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }

/* Switch */
.switch { width: 50px; height: 30px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); position: relative; cursor: pointer; flex: none; transition: background .2s ease; }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); transition: transform .2s ease; }
.switch.on { background: var(--gold); border-color: var(--gold); }
.switch.on .knob { transform: translateX(20px); background: var(--on-gold); }

/* Field editor */
.edit-fields { justify-self: start; align-self: flex-start; padding-left: 0; }
.content > .edit-fields { align-self: center; }
.fe-list { display: grid; gap: 8px; }
.fe-row { display: flex; gap: 6px; align-items: center; }
.fe-move { display: grid; gap: 2px; flex: none; }
.fe-arrow { border: 0; background: none; color: var(--gold); font-size: .62rem; line-height: 1; padding: 3px 4px; cursor: pointer; }
.fe-arrow:disabled { opacity: .25; cursor: default; }
.fe-name { flex: 1; min-width: 0; padding: 10px 12px; }
.fe-kind { flex: none; min-width: 74px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); padding: 7px 10px; font-size: .78rem; font-weight: 600; cursor: pointer; color: var(--fg); }
.fe-kind.kind-secret { border-color: var(--gold); color: var(--gold); }
.fe-kind.kind-multi { border-style: dashed; }
.fe-del { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
@media (hover: hover) { .fe-del:hover { color: var(--danger); border-color: var(--danger); } }

.ico-hero.ico-colour { width: 40px; height: 40px; padding: 9px; box-shadow: none; }

.cat-hero .ico { filter: none; }

/* ---------- Home: list view ---------- */
.home-grid.as-list {
  grid-template-columns: 1fr; gap: 6px;
}
body.is-home .home-grid.as-list { grid-template-rows: repeat(var(--rows, 12), minmax(0, 1fr)); gap: 5px; }
.home-grid.as-list .home-tile {
  flex-direction: row; justify-content: flex-start; gap: 14px; padding: 0 14px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line); max-height: 64px; align-self: center; height: 100%;
}
.home-grid.as-list .home-icon { width: min(40px, calc(100cqh - 10px)); border-radius: 28%; }
.home-grid.as-list .home-icon::before { display: none; }
.home-grid.as-list .home-tile.has .home-icon::after { display: none; }
.home-grid.as-list .ico-home.ico-emoji { font-size: calc(min(40px, 100cqh - 10px) * .58); }
.home-grid.as-list .home-label { flex: 1; text-align: left; font-size: 1rem; color: var(--fg); opacity: 1; }
.home-count, .home-chev { display: none; }
.home-grid.as-list .home-count { display: inline; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.home-grid.as-list .home-chev { display: inline; color: var(--muted); font-size: 1.3rem; line-height: 1; }
.home-grid.as-list .home-tile.wiggle { border-style: dashed; border-color: var(--gold); }
.home-grid.as-list .home-tile.wiggle .home-icon { animation: none; border-style: solid; }
.home-grid.as-list .home-tile.dragging { box-shadow: 0 10px 24px rgba(0,0,0,.35); background: var(--surface-2); }
@media (hover: hover) { .home-grid.as-list .home-tile:hover { border-color: var(--gold); } }
.home-grid.as-list .ico-home { width: 58%; height: 58%; filter: none; }

/* =========================================================
   Glass: see-through frosted panels over a slow colour glow
   ========================================================= */
.glow-backdrop { display: none; }
[data-glass="on"] .glow-backdrop {
  display: block; position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: var(--bg);
}
[data-glass="on"] #app, [data-glass="on"] .preview-banner { position: relative; z-index: 1; }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
.b1 { width: 70vmax; height: 70vmax; left: -25vmax; top: -20vmax; background: radial-gradient(circle, var(--gold) 0%, transparent 65%); animation: drift1 22s ease-in-out infinite alternate; }
.b2 { width: 60vmax; height: 60vmax; right: -25vmax; top: 30%; background: radial-gradient(circle, color-mix(in srgb, var(--gold-hi) 60%, #6aa8ff) 0%, transparent 65%); opacity: .35; animation: drift2 26s ease-in-out infinite alternate; }
.b3 { width: 55vmax; height: 55vmax; left: 5%; bottom: -30vmax; background: radial-gradient(circle, color-mix(in srgb, var(--gold) 50%, var(--surface-2)) 0%, transparent 65%); opacity: .5; animation: drift1 30s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { to { transform: translate(8vmax, 10vmax) scale(1.1); } }
@keyframes drift2 { to { transform: translate(-10vmax, -8vmax) scale(.95); } }

[data-glass="on"] {
  --glass: color-mix(in srgb, var(--surface) 38%, transparent);
  --glass-2: color-mix(in srgb, var(--surface-2) 45%, transparent);
  --glass-line: color-mix(in srgb, var(--fg) 14%, transparent);
  --blur: blur(22px) saturate(1.5);
}
[data-glass="on"] body { background: var(--bg); }
[data-glass="on"] body::before { background: transparent; }
[data-glass="on"] .preview-banner { background: var(--glass-2); border-color: var(--glass-line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
[data-glass="on"] .topbar { background: color-mix(in srgb, var(--surface) 30%, transparent); border-color: var(--glass-line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
[data-glass="on"] :is(.card, .list, .promises, .seg, .dd-list, .more-list, .tip, .rk, .gen-out, .unlock-panel .pw-wrap) {
  background: var(--glass); border-color: var(--glass-line);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 10%, transparent);
}
[data-glass="on"] :is(.input, .dd-btn, .btn.outline, .mini, .chip, .type-tile, .att-tile, .att-empty, .theme-opt, .icon-pick, .fe-kind, .more-row, .dd-opt, .row-main, .setting-row select) {
  background: var(--glass-2); border-color: var(--glass-line);
}
[data-glass="on"] .more-row, [data-glass="on"] .dd-opt { background: transparent; }
[data-glass="on"] .sheet {
  background: color-mix(in srgb, var(--surface) 62%, transparent); border-color: var(--glass-line);
  -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6);
}
[data-glass="on"] .overlay { background: color-mix(in srgb, #000 30%, transparent); }
[data-glass="on"] .busy { background: color-mix(in srgb, var(--bg) 45%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
/* Home tiles become frosted glass */
[data-glass="on"]:not([data-icons="colour"]) .home-icon {
  background:
    radial-gradient(90% 70% at 28% 10%, color-mix(in srgb, #fff 16%, transparent), transparent 60%),
    color-mix(in srgb, var(--surface-2) 34%, transparent);
  border-color: color-mix(in srgb, #fff 16%, transparent);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 22%, transparent), 0 10px 26px -12px color-mix(in srgb, #000 55%, transparent);
}
[data-glass="on"][data-icons="colour"] .home-icon { background:
    radial-gradient(90% 70% at 28% 10%, color-mix(in srgb, #fff 32%, transparent), transparent 60%),
    linear-gradient(160deg, color-mix(in srgb, var(--c) 72%, transparent), color-mix(in srgb, var(--c) 58%, transparent));
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
[data-glass="on"] .home-grid.as-list .home-tile { background: var(--glass); border-color: var(--glass-line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
[data-glass="on"] .big-lock { background: radial-gradient(circle at 50% 35%, color-mix(in srgb, #fff 14%, transparent), color-mix(in srgb, var(--surface) 30%, transparent) 70%);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
[data-glass="on"] .fab { box-shadow: 0 10px 30px -6px color-mix(in srgb, var(--gold) 60%, transparent); }
@media (prefers-color-scheme: light) {
  [data-glass="on"]:not([data-oy-theme]) .blob { opacity: .35; }
}

/* Clearer glass for category tiles and rows (see-through) */
[data-glass="on"]:not([data-icons="colour"]) .home-icon {
  background:
    linear-gradient(155deg, color-mix(in srgb, #fff 16%, transparent), color-mix(in srgb, #fff 3%, transparent) 55%, color-mix(in srgb, #fff 7%, transparent));
  border-color: color-mix(in srgb, #fff 24%, transparent);
  -webkit-backdrop-filter: blur(12px) saturate(1.6); backdrop-filter: blur(12px) saturate(1.6);
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 30%, transparent), inset 0 -1px 0 color-mix(in srgb, #fff 6%, transparent),
    0 8px 22px -14px color-mix(in srgb, #000 60%, transparent);
}
[data-glass="on"] .home-icon::before { background: linear-gradient(180deg, color-mix(in srgb, #fff 14%, transparent), transparent); }
[data-glass="on"][data-icons="colour"] .home-icon {
  background:
    linear-gradient(155deg, color-mix(in srgb, #fff 22%, transparent), transparent 55%),
    linear-gradient(160deg, color-mix(in srgb, var(--c) 46%, transparent), color-mix(in srgb, var(--c) 30%, transparent));
  border-color: color-mix(in srgb, #fff 26%, transparent);
  -webkit-backdrop-filter: blur(12px) saturate(1.6); backdrop-filter: blur(12px) saturate(1.6);
}
[data-glass="on"] .home-grid.as-list .home-tile,
[data-glass="on"] :is(.list, .more-list) {
  background: linear-gradient(155deg, color-mix(in srgb, #fff 10%, transparent), color-mix(in srgb, #fff 3%, transparent));
  border-color: color-mix(in srgb, #fff 18%, transparent);
  -webkit-backdrop-filter: blur(12px) saturate(1.6); backdrop-filter: blur(12px) saturate(1.6);
}
[data-glass="on"] .home-grid.as-list .home-icon { background: color-mix(in srgb, #fff 10%, transparent); }
[data-glass="on"][data-icons="colour"] .home-grid.as-list .home-icon { background: linear-gradient(160deg, color-mix(in srgb, var(--c) 80%, transparent), color-mix(in srgb, var(--c) 60%, transparent)); }
[data-glass="on"] .row-main { background: transparent; }
[data-glass="on"] .row-item { border-color: color-mix(in srgb, #fff 10%, transparent); }
[data-glass="on"] .blob { opacity: .7; }
[data-glass="on"] .b2 { opacity: .45; }
[data-glass="on"] .list .row-main, [data-glass="on"] .list .copy-btn { background: transparent; }
.row-cat { width: 30px; height: 30px; flex: none; color: var(--gold); }
.row-cat.ico-colour { padding: 6px; }
.row-cat.ico-emoji { font-size: 22px; width: 30px; height: auto; }
.home-label { font-size: .74rem; }
.home-grid.as-list .home-label { font-size: .98rem; }

/* =================== Design pass 2 =================== */
/* Letter badges */
.avatar { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center;
  font: 700 1rem/1 var(--font-display); color: #fff;
  background: linear-gradient(150deg, hsl(var(--h) 70% 58%), hsl(calc(var(--h) + 18) 62% 40%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 4px 10px -4px hsl(var(--h) 60% 30% / .6); }
.row-main { gap: 12px; }

/* Expiry tags */
.tag { font-size: .7rem; font-weight: 700; letter-spacing: .02em; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }

.head-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Home strip */
.exp-strip { display: flex; align-items: center; gap: 10px; margin: 10px max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
  padding: 10px 14px; border-radius: 14px; border: 1px solid rgba(245, 158, 11, .45); background: rgba(245, 158, 11, .14);
  color: var(--fg); font-weight: 600; font-size: .9rem; cursor: pointer; text-align: left; flex: none;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.exp-strip .ico { color: #f59e0b; width: 20px; height: 20px; }
.exp-strip.has-expired { border-color: rgba(214, 69, 69, .55); background: rgba(214, 69, 69, .16); }
.exp-strip.has-expired .ico { color: #ef5b5b; }
.exp-text { flex: 1; }
.exp-strip .home-chev { display: inline; color: var(--muted); font-size: 1.3rem; }

/* Password health */
.health { display: inline-flex; align-items: center; gap: 6px; }
.ring { width: 16px; height: 16px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--hc) calc(var(--p) * 1%), color-mix(in srgb, var(--fg) 14%, transparent) 0);
  -webkit-mask: radial-gradient(circle, transparent 4.5px, #000 5px); mask: radial-gradient(circle, transparent 4.5px, #000 5px); }
.health-good { --hc: #2fb872; } .health-mid { --hc: #f0b429; } .health-bad { --hc: #e5484d; }
.health-label { font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: none; color: var(--hc); }
.field-label { display: flex; align-items: center; gap: 10px; }

/* Bank card face */
.face-wrap { display: grid; gap: 6px; justify-items: center; }
.card-face {
  width: 100%; max-width: 360px; aspect-ratio: 1.586; border-radius: 18px; border: 0; cursor: pointer; color: #fff; text-align: left;
  display: grid; grid-template-rows: auto 1fr auto auto; padding: 18px 20px; position: relative; overflow: hidden;
  background:
    radial-gradient(120% 90% at 100% 0%, hsl(calc(var(--h) + 30) 70% 60% / .55), transparent 55%),
    radial-gradient(90% 80% at 0% 100%, hsl(calc(var(--h) - 20) 70% 25% / .9), transparent 60%),
    linear-gradient(135deg, hsl(var(--h) 55% 38%), hsl(calc(var(--h) + 25) 55% 22%));
  box-shadow: 0 18px 36px -16px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25);
  font-family: var(--font-body);
}
.card-face::after { content: ""; position: absolute; inset: -40% -10% auto 30%; height: 120%; transform: rotate(18deg);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent); pointer-events: none; }
.cf-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cf-name { font-weight: 600; font-size: .95rem; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cf-net { font: 800 1.05rem/1 var(--font-display); font-style: italic; letter-spacing: .02em; }
.chip-art { width: 44px; height: 33px; align-self: center; margin-top: 6px; }
.chip-art svg { width: 100%; height: 100%; display: block; }
.cf-number { font: 600 clamp(1rem, 5.2vw, 1.3rem)/1.2 var(--font-mono); letter-spacing: .08em; text-shadow: 0 1px 2px rgba(0,0,0,.4); margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
.cf-bottom { display: flex; justify-content: space-between; gap: 12px; font-size: .9rem; font-weight: 600; text-transform: uppercase; }
.cf-holder, .cf-exp { display: grid; gap: 1px; min-width: 0; }
.cf-holder { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cf-exp { text-align: right; }
.cf-cap { font-size: .6rem; letter-spacing: .14em; opacity: .7; font-weight: 600; text-transform: uppercase; }
.face-hint { font-size: .75rem; color: var(--muted); }

/* ID card */
.id-card { width: 100%; max-width: 360px; justify-self: center; align-self: center; border-radius: 16px; overflow: hidden;
  background: linear-gradient(160deg, #fbfaf6, #ece8dc); color: #1d2433; box-shadow: 0 16px 32px -16px rgba(0,0,0,.55), inset 0 1px 0 #fff; }
.id-band { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; color: #fff; font: 700 .72rem/1.2 var(--font-display); letter-spacing: .14em;
  background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 70%, #000)); }
.id-state { font-family: var(--font-body); letter-spacing: .06em; opacity: .9; }
.id-body { display: flex; gap: 14px; padding: 14px; align-items: center; }
.id-photo { width: 72px; aspect-ratio: 3 / 4; border-radius: 8px; flex: none; display: grid; place-items: center;
  background: #dcd6c6 center / cover no-repeat; border: 1px solid rgba(0,0,0,.08); color: var(--c); }
.id-photo.has-img { border-color: rgba(0,0,0,.15); }
.id-ph-ico { width: 30px; height: 30px; color: var(--c); }
.id-ph-ico.ico-colour { padding: 6px; width: 34px; height: 34px; }
.id-lines { display: grid; gap: 4px; min-width: 0; }
.id-name { font-weight: 700; font-size: 1rem; overflow-wrap: anywhere; }
.id-row { display: flex; gap: 8px; align-items: baseline; font: 600 .88rem/1.3 var(--font-mono); }
.id-row .cf-cap { color: #5b6476; opacity: 1; min-width: 52px; font-family: var(--font-body); }
.id-lines .tag { justify-self: start; margin-top: 2px; }

/* Empty screens */
.empty-art { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 26px 12px 8px; }
.empty-orb { position: relative; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 6px;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--gold-hi) 26%, transparent), color-mix(in srgb, var(--gold) 6%, transparent) 70%);
  border: 1px dashed color-mix(in srgb, var(--gold) 45%, transparent); }
.empty-ico { width: 48px; height: 48px; }
.empty-ico.ico-colour { width: 52px; height: 52px; padding: 12px; }
.empty-ico.ico-emoji { font-size: 44px; width: auto; height: auto; }
.spark { position: absolute; width: 8px; height: 8px; background: var(--gold-hi); border-radius: 2px; transform: rotate(45deg); opacity: .8; animation: twinkle 2.4s ease-in-out infinite; }
.s1 { top: 8px; right: 14px; } .s2 { bottom: 14px; left: 6px; width: 6px; height: 6px; animation-delay: .8s; } .s3 { top: 30px; left: -4px; width: 5px; height: 5px; animation-delay: 1.5s; }
@keyframes twinkle { 50% { opacity: .15; transform: rotate(45deg) scale(.6); } }
.empty-title { font: 600 1.1rem/1.3 var(--font-display); }
.empty-tip { max-width: 30ch; font-size: .92rem; }
.empty-art .btn { margin-top: 8px; }

/* Row category icon in All / Favourites / Recent */
.row-cat { width: 38px; height: 38px; }
.row-cat.ico-colour { padding: 9px; }

/* Page transitions + ripples */
#app { overflow-x: clip; }
.enter-fwd { animation: slideFwd .28s cubic-bezier(.2, .8, .2, 1); }
.enter-back { animation: slideBack .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes slideFwd { from { transform: translateX(28px); opacity: 0; } }
@keyframes slideBack { from { transform: translateX(-28px); opacity: 0; } }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; background: color-mix(in srgb, var(--gold-hi) 35%, transparent);
  transform: scale(0); opacity: .7; animation: ripple .55s ease-out forwards; z-index: 0; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
.home-icon > .ico { z-index: 1; }

/* Small segmented control (Appearance) */
.seg-sm { width: auto; min-width: 190px; grid-template-columns: repeat(3, 1fr); padding: 3px; }
.seg-sm .seg-opt { padding: 7px 8px; font-size: .82rem; }
.appearance-row { gap: 12px; flex-wrap: wrap; }
.id-card .tag-soon { color: #7a4d00; background: #fde3a1; }
.id-card .tag-expired { color: #fff; background: #d64545; }

/* ---------- Opening animation: keyhole turns, logo rises, lock appears ---------- */
.logo-key { transform-box: fill-box; transform-origin: 50% 40%; }
.unlock-screen.intro .unlock-top { animation: logoRise 1.15s cubic-bezier(.65, 0, .25, 1) both; }
.unlock-screen.intro .logo-key { animation: keyTurn .7s cubic-bezier(.5, 0, .2, 1.4) .15s both; }
.unlock-screen.intro .logo-sub { animation: fadeUp .5s ease 1s both; }
.unlock-screen.intro .unlock-mid { animation: lockIn .6s cubic-bezier(.2, .9, .3, 1.2) 1s both; }
.unlock-screen.intro .unlock-foot { animation: fadeUp .5s ease 1.2s both; }
@keyframes logoRise { 0%, 45% { transform: translateY(calc(50dvh - 120px)) scale(1.35); } 100% { transform: none; } }
@keyframes keyTurn { from { transform: rotate(-90deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lockIn { from { opacity: 0; transform: scale(.85); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }

/* ---------- Item page ---------- */
.screen { position: relative; }
.item-hero { position: absolute; inset: 0 0 auto; height: 260px; pointer-events: none; z-index: 0;
  background: radial-gradient(70% 90% at 20% 0%, color-mix(in srgb, var(--c) 45%, transparent), transparent 70%),
              radial-gradient(60% 80% at 90% 10%, color-mix(in srgb, var(--c) 25%, transparent), transparent 70%);
  filter: blur(18px); opacity: .9; }
.item-hero ~ * { position: relative; z-index: 1; }
.field.tap { cursor: pointer; border-radius: 10px; margin: 0 -8px; padding-left: 8px; padding-right: 8px; transition: background .15s ease; }
.field.tap:active { background: color-mix(in srgb, var(--gold) 10%, transparent); }
@media (hover: hover) { .field.tap:hover { background: color-mix(in srgb, var(--fg) 5%, transparent); } }
.field.tap + .field.tap { border-top: 1px solid var(--line); }
.field-actions { align-items: center; }
.eye-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 0; background: none; color: var(--muted); cursor: pointer; }
.eye-btn .ico { width: 19px; height: 19px; }
.copy-mark { position: relative; width: 22px; height: 22px; color: var(--gold); flex: none; }
.copy-mark .ico { position: absolute; inset: 0; width: 22px; height: 22px; transition: transform .25s ease, opacity .25s ease; }
.ico-check { opacity: 0; transform: scale(.4); color: #2fb872; }
.ico-check svg { stroke-width: 2.4; }
.field.copied .ico-copy { opacity: 0; transform: scale(.4); }
.field.copied .ico-check { opacity: 1; transform: none; }
.field.copied { background: color-mix(in srgb, #2fb872 10%, transparent); }
.tap-hint { text-align: center; font-size: .78rem; color: var(--muted); margin-top: -4px; }
.tap-hint.left { text-align: left; margin: 0; }

/* ---------- Vault health ---------- */
.score-ring { position: relative; display: inline-grid; place-items: center; flex: none; color: var(--fg); }
.score-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.score-arc { animation: arcIn 1s cubic-bezier(.3, 0, .2, 1) both; }
@keyframes arcIn { from { stroke-dashoffset: var(--c); } }
.score-num { position: relative; font: 700 2.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.score-num small { font-size: .45em; margin-left: 2px; color: var(--muted); }
.health-strip .score-ring .score-num { font-size: 0; }
.health-hero { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 10px 0 4px; }
.health-verdict { font: 600 1.25rem/1.2 var(--font-display); margin-top: 6px; }
.hcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.hcard { display: grid; justify-items: start; gap: 2px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; min-width: 0; }
.hcard .ico { width: 20px; height: 20px; color: var(--muted); margin-bottom: 4px; }
.hcard.has .ico { color: #f0b429; }
.hcard-n { font: 700 1.5rem/1 var(--font-display); }
.hcard-l { font-weight: 600; font-size: .9rem; }
.hcard-note { font-size: .7rem; color: var(--muted); }
.hcard.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
[data-glass="on"] .hcard { background: var(--glass); border-color: var(--glass-line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }

/* ---------- Home header ---------- */
.home-head { display: grid; gap: 8px; flex: none; padding-top: 10px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.greeting { font: 600 1.05rem/1.2 var(--font-display); color: var(--muted); }
.greeting span { color: var(--fg); }
.health-strip { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; border-radius: 14px; cursor: pointer; text-align: left;
  border: 1px solid var(--line); background: var(--surface); font-size: .9rem; color: var(--fg); }
[data-glass="on"] .health-strip { background: var(--glass); border-color: var(--glass-line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
.health-strip.bad { border-color: rgba(229, 72, 77, .5); }
.health-strip.mid { border-color: rgba(240, 180, 41, .45); }
.hs-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hs-text span { color: var(--muted); }
.health-strip .home-chev { display: inline; color: var(--muted); font-size: 1.3rem; }

/* ---------- Swipe rows ---------- */
.row-item.swipe { position: relative; overflow: hidden; display: block; }
.row-front { display: flex; align-items: center; position: relative; z-index: 1; touch-action: pan-y; }
.row-front .row-main { flex: 1; min-width: 0; }
.swipe-actions { position: absolute; top: 0; right: 0; bottom: 0; display: flex; z-index: 0; transform: translateX(100%); }
.row-item:not(.swiping):not(.open) .swipe-actions { visibility: hidden; }
.swipe-act { width: 70px; border: 0; display: grid; place-content: center; justify-items: center; gap: 3px; color: #fff; font-size: .72rem; font-weight: 700; cursor: pointer; }
.swipe-act .ico { width: 21px; height: 21px; }
.sa-copy { background: #2f7fd6; } .sa-fav { background: #d99a1e; } .sa-del { background: #d64545; }
.row-thumb { width: 38px; height: 38px; flex: none; border-radius: 10px; background: var(--surface-2) center / cover no-repeat; border: 1px solid var(--line); }
.row-thumb.loading { animation: pulse 1.2s infinite; }

/* ---------- Pull to search ---------- */
.screen.home { position: relative; }
.pull-hint { position: absolute; left: 0; right: 0; top: 70px; z-index: 0; display: flex; justify-content: center; align-items: center; gap: 8px;
  font-size: .82rem; font-weight: 600; color: var(--muted); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.pull-hint .ico { width: 16px; height: 16px; }
.pull-hint.show { opacity: 1; }
.pull-hint .ph-b, .pull-hint.ready .ph-a { display: none; }
.pull-hint.ready .ph-b { display: inline; color: var(--gold); }
.pull-hint.ready .ico { color: var(--gold); }
.pull-hint.first:not(.show) { opacity: .55; position: static; padding-top: 6px; flex: none; }
.home-grid { touch-action: none; position: relative; z-index: 1; }
.search-sheet .list { max-height: 50vh; overflow-y: auto; }
.search-cap { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.search-results { min-height: 120px; }

/* ---------- Count badges ---------- */
.home-tile.has .home-icon::after { display: none; }
.home-badge { position: absolute; top: 7%; right: 7%; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; z-index: 2;
  display: grid; place-items: center; font: 700 .68rem/1 var(--font-body); font-variant-numeric: tabular-nums;
  background: var(--gold); color: var(--on-gold); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
[data-icons="colour"] .home-badge { background: #fff; color: #111; }
.home-grid.as-list .home-badge { display: none; }
.name-input { width: 52%; padding: 9px 12px; text-align: right; }

/* ---------- Keyhole unlock ---------- */
.big-lock { overflow: visible; }
.big-lock-art { width: 70px; height: 98px; display: block; position: relative; z-index: 2;
  filter: drop-shadow(0 8px 16px color-mix(in srgb, var(--gold) 35%, transparent)); }
.big-lock-art svg { width: 100%; height: 100%; overflow: visible; }
.kh { transform-box: view-box; transform-origin: 50px 52px; }
.kh-light { opacity: 0; }
/* idle: a slow warm glow breathing inside the keyhole */
.kh-light { animation: khIdle 3.2s ease-in-out infinite; }
@keyframes khIdle { 0%, 100% { opacity: 0; } 50% { opacity: .18; } }
/* success: turn like a key → fill with light → fly through */
.opening .kh { animation: khTurn .5s cubic-bezier(.5, 0, .3, 1.5) forwards; }
.opening .kh-light { animation: khFill .35s ease .45s forwards; }




@keyframes khTurn { 0% { transform: none; } 100% { transform: rotate(90deg); } }
@keyframes khFill { from { opacity: 0; } to { opacity: 1; } }
@keyframes khThrough { 0% { transform: none; filter: drop-shadow(0 0 30px var(--gold-hi)); }
  100% { transform: scale(26); opacity: 0; filter: drop-shadow(0 0 60px var(--gold-hi)); } }
@keyframes khDisc { 0% { } 30% { box-shadow: 0 0 0 1px var(--gold), 0 0 60px 8px color-mix(in srgb, var(--gold) 50%, transparent); }
  60%, 100% { box-shadow: 0 0 0 1px transparent, 0 0 90px 30px color-mix(in srgb, var(--gold) 40%, transparent); background: transparent; } }
@keyframes fadeAway { to { opacity: 0; transform: translateY(-10px); } }
.unlock-screen { overflow: hidden; }
.sync-bar { display: flex; align-items: center; gap: 8px; margin: 8px max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
  padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(240, 180, 41, .45); background: rgba(240, 180, 41, .12);
  color: var(--fg); font-size: .82rem; font-weight: 600; cursor: pointer; text-align: left; flex: none; }
.sync-bar .ico { width: 16px; height: 16px; color: #f0b429; }

/* ---------- Vault doors ---------- */
.opening .lock-hint, .opening .unlock-panel { transition: opacity .25s ease; opacity: 0; }
.opening .big-lock { box-shadow: 0 0 0 1px var(--gold), 0 0 50px 6px color-mix(in srgb, var(--gold) 45%, transparent); transition: box-shadow .4s ease; }
.doors { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.door { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; background: var(--bg);
  transition: transform .8s cubic-bezier(.6, 0, .2, 1); will-change: transform; }
.door-l { left: 0; } .door-r { right: 0; }
.door-inner { position: absolute; top: 0; bottom: 0; width: 100vw; }
.door-l .door-inner { left: 0; } .door-r .door-inner { right: 0; }
.door-inner .door-bg { position: absolute; inset: 0; }
.door-app { position: relative; max-width: 560px; margin: 0 auto; min-height: 100vh; }
.door-app .unlock-screen.opening .kh { animation: none; transform: rotate(90deg); }
.door-app .kh-light { animation: none; opacity: 1; }
.door-app .logo-sub .sub-a { opacity: 0; transition: none; }
.door-app .logo-sub .sub-b { opacity: 1; transform: none; letter-spacing: .4em; transition: none; }
.door-app *, .door-app *::before, .door-app *::after { animation: none !important; }
/* a thin gold edge on each door, glowing at the seam */
.door-edge { position: absolute; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, transparent, var(--gold-hi) 30%, var(--gold-hi) 70%, transparent);
  box-shadow: 0 0 18px 2px color-mix(in srgb, var(--gold) 70%, transparent); opacity: 0; transition: opacity .2s ease; }
.door-l .door-edge { right: 0; } .door-r .door-edge { left: 0; }
.doors.open .door-edge { opacity: 1; }
.doors.open .door-l { transform: translateX(-102%); }
.doors.open .door-r { transform: translateX(102%); }
.door { box-shadow: 0 0 40px rgba(0, 0, 0, .5); }

/* ---------- Safe dial unlock ---------- */
.big-lock { width: 184px; height: 184px; }
.big-lock-art.dial-art { width: 150px; height: 150px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)) drop-shadow(0 0 14px color-mix(in srgb, var(--gold) 25%, transparent)); }
.dial-art svg { width: 100%; height: 100%; overflow: visible; }
.d-face { transform-box: view-box; transform-origin: 100px 100px; }
.dt { stroke: color-mix(in srgb, var(--gold) 35%, #000); stroke-width: .9; }

<body>
<div class="preview-banner">Demo with made-up data — nothing you do here is saved. To unlock after locking, use the password <b>sample-password-123</b></div>
<div id="app"></div>
<script>
window.OY_PREVIEW = true;
(() => {
const C = (() => {
// OY! (Only You) — encryption core
// Everything is encrypted on the user's device. The master password and the
// vault key never leave the device and are never stored in plain form.
//
// Design:
//  - A random 256-bit vault key (VK) encrypts the vault data with AES-256-GCM.
//  - VK is "wrapped" (encrypted) twice:
//      1. with a key derived from the master password (PBKDF2-SHA256, 600k rounds)
//      2. with a key derived from the recovery key (random 128-bit, shown once)
//  - Changing the master password only re-wraps VK; the data does not change.

const subtle = globalThis.crypto.subtle;
const enc = new TextEncoder();
const dec = new TextDecoder();

const KDF_ITERATIONS = 600000;
const RECOVERY_ITERATIONS = 100000; // recovery key is already high-entropy

const b64 = {
  from(buf) {
    const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(s);
  },
  to(str) {
    const s = atob(str);
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
};

function randomBytes(n) {
  return globalThis.crypto.getRandomValues(new Uint8Array(n));
}

async function deriveKey(secret, salt, iterations) {
  const base = await subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt, iterations },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function aesEncrypt(key, bytes) {
  const iv = randomBytes(12);
  const ct = await subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes);
  return { iv: b64.from(iv), ct: b64.from(ct) };
}

async function aesDecrypt(key, box) {
  const pt = await subtle.decrypt({ name: 'AES-GCM', iv: b64.to(box.iv) }, key, b64.to(box.ct));
  return new Uint8Array(pt);
}

async function importVaultKey(raw) {
  return subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}

// Recovery key: 32 characters from an unambiguous alphabet, shown as 8 groups of 4
const RK_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 32 symbols = 5 bits each → 160 bits
function makeRecoveryKey() {
  const bytes = randomBytes(32);
  let out = '';
  for (let i = 0; i < 32; i++) out += RK_ALPHABET[bytes[i] & 31];
  return out.match(/.{4}/g).join('-');
}
function normaliseRecoveryKey(rk) {
  return String(rk).toUpperCase().replace(/[^A-Z0-9]/g, '');
}

async function wrap(secret, iterations, vkRaw) {
  const salt = randomBytes(16);
  const kek = await deriveKey(secret, salt, iterations);
  const box = await aesEncrypt(kek, vkRaw);
  return { salt: b64.from(salt), iter: iterations, ...box };
}

async function unwrap(secret, w) {
  const kek = await deriveKey(secret, b64.to(w.salt), w.iter);
  return aesDecrypt(kek, w); // throws if secret is wrong (GCM auth fails)
}

// ---- Public API ---------------------------------------------------------

/** Create a brand new vault. Returns { file, session, recoveryKey }. */
async function createVault(masterPassword, data = { items: [] }) {
  const vkRaw = randomBytes(32);
  const recoveryKey = makeRecoveryKey();
  const file = {
    app: 'OY',
    version: 1,
    keys: {
      password: await wrap(masterPassword, KDF_ITERATIONS, vkRaw),
      recovery: await wrap(normaliseRecoveryKey(recoveryKey), RECOVERY_ITERATIONS, vkRaw)
    },
    data: null,
    updatedAt: 0
  };
  const session = { vk: await importVaultKey(vkRaw), vkRaw };
  await sealData(file, session, data);
  return { file, session, recoveryKey };
}

/** Unlock with master password. Returns { session, data }. Throws on wrong password. */
async function unlockWithPassword(file, masterPassword) {
  const vkRaw = await unwrap(masterPassword, file.keys.password);
  return openWith(file, vkRaw);
}

/** Unlock with recovery key. Returns { session, data }. */
async function unlockWithRecovery(file, recoveryKey) {
  const vkRaw = await unwrap(normaliseRecoveryKey(recoveryKey), file.keys.recovery);
  return openWith(file, vkRaw);
}

async function openWith(file, vkRaw) {
  const session = { vk: await importVaultKey(vkRaw), vkRaw };
  const data = JSON.parse(dec.decode(await aesDecrypt(session.vk, file.data)));
  return { session, data };
}

/** Encrypt data into the file (fresh IV every time). Mutates and returns file. */
async function sealData(file, session, data) {
  file.data = await aesEncrypt(session.vk, enc.encode(JSON.stringify(data)));
  file.updatedAt = Date.now();
  return file;
}

/** Encrypt a file's bytes (photo, PDF) with the vault key. */
async function encryptBytes(session, bytes) {
  return aesEncrypt(session.vk, bytes);
}
/** Decrypt a file encrypted with encryptBytes. */
async function decryptBytes(session, box) {
  return aesDecrypt(session.vk, box);
}

// ---- Face ID / fingerprint (WebAuthn PRF) ----
// The passkey gives back a secret only after Face ID/fingerprint succeeds.
// We turn that secret into a key that wraps the vault key on this device.
async function keyFromSecret(secretBytes) {
  const base = await subtle.importKey('raw', secretBytes, 'HKDF', false, ['deriveKey']);
  return subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: enc.encode('OY-biometric-v1'), info: new Uint8Array(0) },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function wrapForDevice(secretBytes, session) {
  return aesEncrypt(await keyFromSecret(secretBytes), session.vkRaw);
}
async function unlockWithDeviceSecret(file, secretBytes, box) {
  const vkRaw = await aesDecrypt(await keyFromSecret(secretBytes), box);
  return openWith(file, vkRaw);
}

/** Set a new master password (after unlocking by password or recovery key). */
async function changePassword(file, session, newPassword) {
  file.keys.password = await wrap(newPassword, KDF_ITERATIONS, session.vkRaw);
  file.updatedAt = Date.now();
  return file;
}

/** Issue a new recovery key (old one stops working). */
async function rotateRecoveryKey(file, session) {
  const recoveryKey = makeRecoveryKey();
  file.keys.recovery = await wrap(normaliseRecoveryKey(recoveryKey), RECOVERY_ITERATIONS, session.vkRaw);
  file.updatedAt = Date.now();
  return recoveryKey;
}

function isVaultFile(obj) {
  return !!(obj && obj.app === 'OY' && obj.keys && obj.keys.password && obj.keys.recovery && obj.data);
}

/** Wipe key material from memory as far as JS allows. */
function lockSession(session) {
  if (session && session.vkRaw) session.vkRaw.fill(0);
}

// ---- Password generator -------------------------------------------------

function generatePassword({ length = 20, upper = true, lower = true, digits = true, symbols = true } = {}) {
  const sets = [];
  if (lower) sets.push('abcdefghijkmnopqrstuvwxyz');
  if (upper) sets.push('ABCDEFGHJKLMNPQRSTUVWXYZ');
  if (digits) sets.push('23456789');
  if (symbols) sets.push('!@#$%^&*-_=+?');
  if (!sets.length) sets.push('abcdefghijkmnopqrstuvwxyz');
  const all = sets.join('');
  const pick = (chars) => {
    // rejection sampling to avoid modulo bias
    const limit = 256 - (256 % chars.length);
    while (true) {
      const b = randomBytes(1)[0];
      if (b < limit) return chars[b % chars.length];
    }
  };
  const out = sets.map(pick); // at least one from each chosen set
  while (out.length < length) out.push(pick(all));
  // Fisher–Yates shuffle with unbiased indices
  for (let i = out.length - 1; i > 0; i--) {
    const limit = 256 - (256 % (i + 1));
    let b; do { b = randomBytes(1)[0]; } while (b >= limit);
    const j = b % (i + 1);
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out.slice(0, length).join('');
}

/** Rough strength score 0–4 based on length and character variety. */
function strength(pw) {
  if (!pw) return 0;
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) pool += 20;
  const bits = pw.length * Math.log2(Math.max(pool, 1));
  if (bits < 40) return 0;
  if (bits < 60) return 1;
  if (bits < 80) return 2;
  if (bits < 100) return 3;
  return 4;
}

return { KDF_ITERATIONS, b64, randomBytes, makeRecoveryKey, normaliseRecoveryKey, createVault, unlockWithPassword, unlockWithRecovery, sealData, encryptBytes, decryptBytes, wrapForDevice, unlockWithDeviceSecret, changePassword, rotateRecoveryKey, isVaultFile, lockSession, generatePassword, strength };
})();

const S = (() => {
const GOOGLE_CLIENT_ID = ''; const VAULT_FILE_NAME = 'oy-vault.json';
// OY! storage: an encrypted copy on this device (IndexedDB) plus, when signed
// in, the same encrypted file in the user's own Google Drive app folder.
// Only encrypted vault files ever pass through this module.


// ---------- Device storage (IndexedDB) ----------
const DB_NAME = 'oy';
const STORE = 'vaults';

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('oydemo', 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function tx(mode, fn) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const t = db.transaction(STORE, mode);
    const req = fn(t.objectStore(STORE));
    t.oncomplete = () => { db.close(); resolve(req && req.result); };
    t.onerror = () => { db.close(); reject(t.error); };
  });
}
const local = {
  get: (id) => tx('readonly', (s) => s.get(id)),
  put: (id, file) => tx('readwrite', (s) => s.put(file, id)),
  del: (id) => tx('readwrite', (s) => s.delete(id))
};

// ---------- Remembered account (not secret: just name/email) ----------
const ACCOUNT_KEY = 'oydemo.account';
function rememberedAccount() {
  try { return JSON.parse(localStorage.getItem(ACCOUNT_KEY)); } catch { return null; }
}
function rememberAccount(acc) {
  try { acc ? localStorage.setItem(ACCOUNT_KEY, JSON.stringify(acc)) : localStorage.removeItem(ACCOUNT_KEY); } catch {}
}

// ---------- Google Drive ----------
const driveConfigured = !!GOOGLE_CLIENT_ID;
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata openid email profile';
const API = 'https://www.googleapis.com';

// Sign-in uses Google's redirect flow: the app goes to Google and Google sends it back with
// a short-lived access token (about 1 hour). Unlike a pop-up this also works inside an iPhone
// Home Screen app. The token only allows access to OY!'s own hidden folder in the user's Drive.
let token = null;
let tokenExpiry = 0;
let fileId = null;
const TOK_KEY = 'oydemo.tok';
const FLOW_KEY = 'oydemo.oauth';
(function loadTok() {
  try { const t = JSON.parse(sessionStorage.getItem(TOK_KEY)); if (t && t.exp > Date.now()) { token = t.t; tokenExpiry = t.exp; } } catch {}
})();
function saveTok() {
  try { token ? sessionStorage.setItem(TOK_KEY, JSON.stringify({ t: token, exp: tokenExpiry })) : sessionStorage.removeItem(TOK_KEY); } catch {}
}
function hasToken() { return !!token && Date.now() < tokenExpiry; }
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, '');

/** Go to Google to sign in. intent says what to do when we come back. Never resolves (the page navigates). */
function signIn(hint, intent = 'signin', { silent = false } = {}) {
  const st = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, '0')).join('');
  try { sessionStorage.setItem(FLOW_KEY, JSON.stringify({ st, intent, silent })); } catch {}
  const q = new URLSearchParams({ client_id: GOOGLE_CLIENT_ID, redirect_uri: redirectUri(), response_type: 'token',

// ---------------- Tiny DOM helper (never uses innerHTML for user data) ----------------
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function mix(a, b, t) {
  const p = (x) => [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16));
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  return '#' + [r1 + (r2 - r1) * t, g1 + (g2 - g1) * t, b1 + (b2 - b1) * t].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
}
const TOKENS = ['--bg', '--surface', '--surface-2', '--line', '--fg', '--muted', '--gold', '--gold-hi', '--on-gold'];
const VAULT_COLOURS = ['#D9AD4B', '#F1CD78', '#0F2140'];
function savedAppearance() { try { return localStorage.getItem('oydemo.appearance') || 'auto'; } catch { return 'auto'; } }
function isLight() {
  const a = savedAppearance();

}
function applyTheme(key) {
  const root = document.documentElement;
  const t = THEMES[key] || THEMES.vault;
  if (!t.colours && savedAppearance() === 'auto') {
    // Vault on Auto keeps the hand-tuned light and dark palettes from the stylesheet
    TOKENS.forEach((k) => root.style.removeProperty(k));
    root.style.removeProperty('color-scheme');
    delete root.dataset.oyTheme;
  } else {
    const [accent, hi, deep] = t.colours || VAULT_COLOURS;
    let set;
    if (isLight()) {
      const fg = mix(deep, '#000000', 0.25);
      set = {
        '--bg': mix(deep, '#ffffff', 0.93), '--surface': mix(deep, '#ffffff', 0.985), '--surface-2': mix(deep, '#ffffff', 0.89),
        '--line': mix(deep, '#ffffff', 0.78), '--fg': fg, '--muted': mix(fg, '#ffffff', 0.38),
        '--gold': mix(accent, '#000000', 0.2), '--gold-hi': accent, '--on-gold': '#ffffff'
      };
    } else {
      const fg = mix('#ffffff', hi, 0.08);
      set = {
        '--bg': mix(deep, '#000000', 0.38), '--surface': deep, '--surface-2': mix(deep, accent, 0.14),
        '--line': mix(deep, accent, 0.3), '--fg': fg, '--muted': mix(fg, deep, 0.4),
        '--gold': accent, '--gold-hi': hi, '--on-gold': mix(deep, '#000000', 0.35)
      };
    }
    Object.entries(set).forEach(([k, v]) => root.style.setProperty(k, v));
    root.style.setProperty('color-scheme', isLight() ? 'light' : 'dark');
    root.dataset.oyTheme = key;
  }

}
